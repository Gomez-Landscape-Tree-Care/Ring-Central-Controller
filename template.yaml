AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Ring Central Controller — receives Ring Central webhooks (calls/SMS) and requests
  from the CL and AB Lambdas, and drives the Ring Central Service and Slash backend.

Parameters:
  RCClientSecret:
    Type: String
    Description: SSM parameter path holding the Ring Central client secret
    Default: /ring-central-controller/ring-central/rc-client-secret
  RCJWT:
    Type: String
    Description: SSM parameter path holding the Ring Central JWT
    Default: /ring-central-controller/ring-central/rc-jwt
  SlashServicePassword:
    Type: String
    Description: SSM parameter path holding the Slash service account password
    Default: /ring-central-controller/slash/slash-service-password
  JeffBotMondayApiKey:
    Type: String
    Default: /ring-central-controller/monday/jeff-bot-api-key
  JaimeMondayApiKey:
    Type: String
    Default: /ring-central-controller/monday/jaime-api-key
  VigMondayApiKey:
    Type: String
    Default: /ring-central-controller/monday/vig-api-key
  AndersonMondayApiKey:
    Type: String
    Default: /ring-central-controller/monday/anderson-api-key

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    CodeUri: src/
    MemorySize: 512

Resources:
  RingCentralControllerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ring-central-controller
      Description: Queue consumer for every Ring Central, monday and CL/AB event
      Handler: app.lambda_handler
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref RingCentralControllerLogGroup
      Environment:
        Variables:
          RC_CLIENT_SECRET: !Ref RCClientSecret
          RC_JWT: !Ref RCJWT
          SLASH_SERVICE_PASSWORD: !Ref SlashServicePassword
          JEFF_BOT_MONDAY_API_KEY: !Ref JeffBotMondayApiKey
          JAIME_MONDAY_API_KEY: !Ref JaimeMondayApiKey
          VIG_MONDAY_API_KEY: !Ref VigMondayApiKey
          ANDERSON_MONDAY_API_KEY: !Ref AndersonMondayApiKey
          PROCESSED_MESSAGES_TABLE: !Ref ProcessedMessagesTable
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: ring-central-controller/*
        - DynamoDBCrudPolicy:
            TableName: !Ref ProcessedMessagesTable
      Events:
        RingCentralEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt RingCentralEventQueue.Arn
            BatchSize: 1
      FunctionUrlConfig:
        AuthType: NONE

  RingCentralControllerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ring-central-controller
      RetentionInDays: 30

  RingCentralReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ring-central-controller-receiver
      Description: Public webhook receiver — enqueues telephony, inbound and outbound SMS, and monday notifications
      Handler: receiver.lambda_handler
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref RingCentralReceiverLogGroup
      Environment:
        Variables:
          EVENT_QUEUE_URL: !Ref RingCentralEventQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RingCentralEventQueue.QueueName
      FunctionUrlConfig:
        AuthType: NONE

  RingCentralReceiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ring-central-controller-receiver
      RetentionInDays: 30

  # Ordered per call for telephony, per person for inbound SMS and CL/AB sends,
  # per extension for outbound SMS (its payload carries no phone) and per item
  # for monday. Telephony deduplicates per call state and outbound SMS on the
  # Ring Central message id; the rest have no natural dedup key, so the receiver
  # sends a random one. Every producer always supplies both ids, so content
  # based deduplication stays off.
  RingCentralEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ring-central-controller-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RingCentralEventDLQ.Arn
        maxReceiveCount: 3

  RingCentralEventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ring-central-controller-events-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Every RingCentral message id the controller has already recorded. A message
  # we sent ourselves comes straight back on the Outbound message-store webhook,
  # where nothing distinguishes it from one an agent typed in the RingCentral
  # app; the id registered at send time is the whole difference. Entries expire
  # after a day, which is well past RingCentral's own redelivery window.
  ProcessedMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ring-central-controller-processed-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: message_id
          AttributeType: S
      KeySchema:
        - AttributeName: message_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  FunctionUrl:
    Description: >-
      Public HTTPS endpoint the outbound message-store subscription used to post to.
      Kept only until that subscription is repointed at the receiver's /sms/outbound.
    Value: !GetAtt RingCentralControllerFunctionUrl.FunctionUrl
  FunctionArn:
    Description: ARN of the controller function
    Value: !GetAtt RingCentralControllerFunction.Arn
  ReceiverFunctionUrl:
    Description: >-
      Public HTTPS endpoint for the telephony sessions webhook subscription;
      the inbound and outbound SMS subscriptions and monday webhooks subscribe to
      the same URL with a /sms/inbound, /sms/outbound and /monday path
    Value: !GetAtt RingCentralReceiverFunctionUrl.FunctionUrl
  EventQueueUrl:
    Description: FIFO queue carrying telephony, SMS, monday and CL/AB events to the controller
    Value: !Ref RingCentralEventQueue
  EventDLQUrl:
    Description: Dead letter queue for telephony notifications that exhausted their retries
    Value: !Ref RingCentralEventDLQ
  ProcessedMessagesTableName:
    Description: Ledger of RingCentral message ids the controller has already recorded
    Value: !Ref ProcessedMessagesTable
